<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #0f2340;
  --blue: #1a4a8a;
  --accent: #2e7dd4;
  --light-blue: #e8f1fb;
  --gold: #c8963e;
  --text: #1c2a3a;
  --muted: #6b7f96;
  --bg: #f4f7fc;
  --white: #ffffff;
  --red: #c0392b;
  --green: #1e7e60;
  --card-shadow: 0 2px 20px rgba(15,35,64,0.08);
  --card-hover: 0 8px 40px rgba(15,35,64,0.15);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

/* HEADER */
header {
  background: var(--navy);
  padding: 0;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 20px rgba(0,0,0,0.3);
}
.header-inner {
  max-width: 1300px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 32px;
  gap: 24px;
}
.logo {
  display: flex;
  flex-direction: column;
  line-height: 1;
}
.logo-name {
  font-family: 'DM Serif Display', serif;
  font-size: 22px;
  color: #fff;
  letter-spacing: 2px;
}
.logo-sub {
  font-size: 11px;
  color: #8daed4;
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-top: 2px;
}

/* SEARCH BAR */
.search-wrap {
  flex: 1;
  max-width: 520px;
  position: relative;
}
.search-wrap input {
  width: 100%;
  padding: 11px 46px 11px 18px;
  border-radius: 8px;
  border: 1.5px solid rgba(255,255,255,0.12);
  background: rgba(255,255,255,0.08);
  color: #fff;
  font-family: 'DM Sans', sans-serif;
  font-size: 15px;
  outline: none;
  transition: all 0.2s;
}
.search-wrap input::placeholder { color: #8daed4; }
.search-wrap input:focus {
  border-color: var(--accent);
  background: rgba(255,255,255,0.13);
}
.search-icon {
  position: absolute;
  right: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: #8daed4;
  pointer-events: none;
  font-size: 18px;
}

/* FILTER PILLS */
.filter-bar {
  background: var(--white);
  border-bottom: 1px solid #dde6f0;
  padding: 12px 32px;
  overflow-x: auto;
  white-space: nowrap;
}
.filter-inner {
  max-width: 1300px;
  margin: 0 auto;
  display: flex;
  gap: 8px;
  align-items: center;
}
.filter-label {
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.8px;
  margin-right: 4px;
  flex-shrink: 0;
}
.pill {
  padding: 5px 14px;
  border-radius: 20px;
  border: 1.5px solid #c8d8ed;
  background: #fff;
  color: var(--blue);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.15s;
  flex-shrink: 0;
  white-space: nowrap;
}
.pill:hover { background: var(--light-blue); border-color: var(--accent); }
.pill.active { background: var(--blue); color: #fff; border-color: var(--blue); }

/* STATS BAR */
.stats-bar {
  max-width: 1300px;
  margin: 28px auto 16px;
  padding: 0 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.results-count {
  font-size: 14px;
  color: var(--muted);
}
.results-count strong { color: var(--text); }

/* GRID */
.grid {
  max-width: 1300px;
  margin: 0 auto;
  padding: 0 32px 60px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
  gap: 20px;
}

/* CARD */
.card {
  background: var(--white);
  border-radius: 14px;
  box-shadow: var(--card-shadow);
  overflow: hidden;
  transition: transform 0.2s, box-shadow 0.2s;
  cursor: pointer;
  display: flex;
  flex-direction: column;
}
.card:hover {
  transform: translateY(-3px);
  box-shadow: var(--card-hover);
}
.card.hidden { display: none; }

.card-header {
  padding: 18px 20px 14px;
  border-bottom: 1px solid #eef2f8;
  display: flex;
  align-items: flex-start;
  gap: 14px;
}
.fach-icon {
  width: 44px;
  height: 44px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  flex-shrink: 0;
}
.card-title-block { flex: 1; }
.card-name {
  font-family: 'DM Serif Display', serif;
  font-size: 17px;
  color: var(--navy);
  line-height: 1.2;
}
.card-fach {
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.7px;
  margin-top: 3px;
}
.card-tel {
  font-size: 13px;
  color: var(--muted);
  margin-top: 4px;
  display: flex;
  align-items: center;
  gap: 5px;
}

.card-body { padding: 14px 20px; flex: 1; }

.info-row {
  display: flex;
  gap: 8px;
  margin-bottom: 7px;
  font-size: 13.5px;
  align-items: flex-start;
}
.info-label {
  font-weight: 600;
  color: var(--muted);
  min-width: 90px;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-top: 1px;
  flex-shrink: 0;
}
.info-value { color: var(--text); line-height: 1.4; }

.hinweis {
  margin-top: 10px;
  padding: 9px 12px;
  background: #fff7f0;
  border-left: 3px solid var(--gold);
  border-radius: 0 6px 6px 0;
  font-size: 12.5px;
  color: #7a4a10;
  line-height: 1.5;
}

/* LEISTUNGEN TABLE */
.leistungen-toggle {
  padding: 12px 20px;
  border-top: 1px solid #eef2f8;
  background: var(--bg);
  font-size: 13px;
  font-weight: 600;
  color: var(--accent);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: background 0.15s;
}
.leistungen-toggle:hover { background: var(--light-blue); }
.toggle-arrow { transition: transform 0.2s; font-size: 11px; }
.toggle-arrow.open { transform: rotate(90deg); }

.leistungen-table {
  display: none;
  padding: 0 20px 16px;
  border-top: 1px solid #eef2f8;
}
.leistungen-table.open { display: block; }

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
th {
  background: var(--navy);
  color: #fff;
  padding: 8px 10px;
  text-align: left;
  font-weight: 600;
  font-size: 11.5px;
  letter-spacing: 0.5px;
}
th:first-child { border-radius: 6px 0 0 0; }
th:last-child { border-radius: 0 6px 0 0; }
td {
  padding: 8px 10px;
  border-bottom: 1px solid #eef2f8;
  color: var(--text);
  vertical-align: top;
}
tr:last-child td { border-bottom: none; }
tr:nth-child(even) td { background: #f7f9fd; }
.price-cell { font-weight: 600; color: var(--blue); white-space: nowrap; }
.dauer-cell { color: var(--muted); white-space: nowrap; }

/* NO RESULTS */
#no-results {
  display: none;
  max-width: 1300px;
  margin: 60px auto;
  text-align: center;
  padding: 0 32px;
}
#no-results h3 { font-family: 'DM Serif Display', serif; color: var(--navy); font-size: 24px; }
#no-results p { color: var(--muted); margin-top: 8px; }

/* MODAL (fullscreen card detail) */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(10,20,40,0.6);
  z-index: 200;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--white);
  border-radius: 16px;
  max-width: 640px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: 0 20px 80px rgba(0,0,0,0.3);
}
.modal-head {
  position: sticky;
  top: 0;
  background: var(--navy);
  padding: 20px 24px;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
}
.modal-name { font-family: 'DM Serif Display', serif; font-size: 22px; color: #fff; }
.modal-fach { font-size: 13px; color: #8daed4; margin-top: 4px; }
.modal-close {
  background: rgba(255,255,255,0.1);
  border: none;
  color: #fff;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 18px;
  line-height: 32px;
  text-align: center;
  flex-shrink: 0;
  transition: background 0.15s;
}
.modal-close:hover { background: rgba(255,255,255,0.2); }
.modal-body { padding: 24px; }
.modal-section { margin-bottom: 20px; }
.modal-section-title {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--muted);
  margin-bottom: 10px;
  border-bottom: 1px solid #eef2f8;
  padding-bottom: 6px;
}
.modal-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.modal-item label {
  display: block;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--muted);
  margin-bottom: 2px;
}
.modal-item span { font-size: 14px; color: var(--text); }

/* Color themes per Fach */
.theme-derm { background: #fce8e8; color: #a33; }

.theme-aku { background: #f8fce8; color: #474; }
.theme-ern { background: #fcf8e8; color: #554; }

@media (max-width: 768px) {
  .header-inner { flex-wrap: wrap; padding: 12px 16px; }
  .search-wrap { max-width: 100%; order: 3; flex: 100%; }
  .filter-bar { padding: 10px 16px; }
  .grid { grid-template-columns: 1fr; padding: 0 16px 40px; }
  .stats-bar { padding: 0 16px; }
  .modal-grid { grid-template-columns: 1fr; }
}

.highlight { background: #fff3b0; border-radius: 2px; }

function buildCard(doc, idx) {
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.idx = idx;
  card.dataset.filter = doc.filter;

  const searchable = [doc.name, doc.fach, doc.filter, doc.suchtext,
    ...doc.leistungen.map(l => l[0])].join(' ').toLowerCase();
  card.dataset.search = searchable;

  const leistRows = doc.leistungen.map((l, i) =>
    `<tr><td>${l[0]}</td><td class="price-cell">${l[1]}</td><td class="dauer-cell">${l[2]}</td></tr>`
  ).join('');

  card.innerHTML = `
    <div class="card-header">
      <div class="fach-icon ${doc.theme}">${doc.icon}</div>
      <div class="card-title-block">
        <div class="card-name">${doc.name}</div>
        <div class="card-fach ${doc.theme}" style="padding:2px 8px;border-radius:4px;display:inline-block;font-size:11px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;">${doc.fach}</div>
        <div class="card-tel">📞 Intern: <strong>${doc.tel}</strong></div>
      </div>
    </div>
    <div class="card-body">
      <div class="info-row"><span class="info-label">Zeiten</span><span class="info-value">${doc.zeiten}</span></div>
      <div class="info-row"><span class="info-label">Dauer</span><span class="info-value">${doc.dauer}</span></div>
      <div class="info-row"><span class="info-label">Preis ab</span><span class="info-value" style="font-weight:600;color:var(--blue)">${doc.preis}</span></div>
      <div class="hinweis">⚠️ ${doc.hinweis}</div>
    </div>
    <div class="leistungen-toggle" onclick="toggleLeistungen(this)">
      <span class="toggle-arrow">▶</span> Leistungen &amp; Preise (${doc.leistungen.length})
    </div>
    <div class="leistungen-table">
      <table>
        <thead><tr><th>Leistung</th><th>Preis</th><th>Dauer</th></tr></thead>
        <tbody>${leistRows}</tbody>
      </table>
    </div>
  `;

  card.querySelector('.card-header').addEventListener('click', () => openModal(idx));
  card.querySelector('.card-body').addEventListener('click', () => openModal(idx));
  return card;
}

function toggleLeistungen(btn) {
  const table = btn.nextElementSibling;
  const arrow = btn.querySelector('.toggle-arrow');
  table.classList.toggle('open');
  arrow.classList.toggle('open');
}

function openModal(idx) {
  const doc = DOCTORS[idx];
  document.getElementById('mName').textContent = doc.name;
  document.getElementById('mFach').textContent = doc.fach;
  const leistRows = doc.leistungen.map(l =>
    `<tr><td>${l[0]}</td><td class="price-cell">${l[1]}</td><td class="dauer-cell">${l[2]}</td></tr>`
  ).join('');
  document.getElementById('mBody').innerHTML = `
    <div class="modal-section">
      <div class="modal-section-title">Buchungsinfo</div>
      <div class="modal-grid">
        <div class="modal-item"><label>Intern Tel.</label><span>📞 ${doc.tel}</span></div>
        <div class="modal-item"><label>Preis ab</label><span style="font-weight:600;color:var(--blue)">${doc.preis}</span></div>
        <div class="modal-item"><label>Sprechzeiten</label><span>${doc.zeiten}</span></div>
        <div class="modal-item"><label>Terminlänge</label><span>${doc.dauer}</span></div>
      </div>
    </div>
    <div class="modal-section">
      <div class="modal-section-title">⚠️ Wichtige Hinweise</div>
      <div style="font-size:14px;line-height:1.6;color:#7a4a10;background:#fff7f0;padding:12px;border-radius:8px;">${doc.hinweis}</div>
    </div>
    <div class="modal-section">
      <div class="modal-section-title">Leistungen &amp; Preise</div>
      <table>
        <thead><tr><th>Leistung</th><th>Preis</th><th>Dauer</th></tr></thead>
        <tbody>${leistRows}</tbody>
      </table>
    </div>
  `;
  document.getElementById('modalOverlay').classList.add('open');
}

document.getElementById('modalClose').onclick = () =>
  document.getElementById('modalOverlay').classList.remove('open');
document.getElementById('modalOverlay').addEventListener('click', e => {
  if (e.target === document.getElementById('modalOverlay'))
    document.getElementById('modalOverlay').classList.remove('open');
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') document.getElementById('modalOverlay').classList.remove('open');
});

// Build grid
const grid = document.getElementById('grid');
DOCTORS.forEach((doc, idx) => grid.appendChild(buildCard(doc, idx)));

// Filter + Search
let currentFilter = 'all';
let currentSearch = '';

function applyFilters() {
  const term = currentSearch.toLowerCase();
  let count = 0;
  document.querySelectorAll('.card').forEach(card => {
    const matchFilter = currentFilter === 'all' || card.dataset.filter === currentFilter;
    const matchSearch = !term || card.dataset.search.includes(term);
    const show = matchFilter && matchSearch;
    card.classList.toggle('hidden', !show);
    if (show) count++;
  });
  document.getElementById('countNum').textContent = count;
  document.getElementById('no-results').style.display = count === 0 ? 'block' : 'none';
}

document.querySelectorAll('.pill').forEach(pill => {
  pill.addEventListener('click', () => {
    document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
    pill.classList.add('active');
    currentFilter = pill.dataset.filter;
    applyFilters();
  });
});

document.getElementById('searchInput').addEventListener('input', e => {
  currentSearch = e.target.value;
  applyFilters();
});
</script>
